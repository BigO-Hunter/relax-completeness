name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build four-pillar completeness theory
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Root package is the main proof (RelaxLFP + Pillar2/3/4); engine-spec/
      # is a separate companion package, built from its own directory.
      - name: Install Lean and cached Mathlib dependencies
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: .
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
